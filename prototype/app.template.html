<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarTune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Sunlight (light) tokens */
:root{
  --bg:#F3F1EC;--panel:#FFFFFF;--raise:#E7E4DC;--line:#C9C4B8;--text:#15191E;--dim:#555D66;--accent:#0A8F80;--accentInk:#FFFFFF;
  --g:#1E8A52;--y:#A98A00;--o:#C25E08;--r:#C4262C;--tape:#E7E4DC;--needle:#15191E;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171C22;--panel:#20262E;--raise:#2A313B;--line:#3A4350;--text:#ECE8DF;--dim:#9AA3AE;--accent:#2FD3C0;--accentInk:#0C2522;
    --g:#3DBE7A;--y:#E3C744;--o:#EF8A2D;--r:#E5575B;--tape:#11151A;--needle:#ECE8DF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171C22;--panel:#20262E;--raise:#2A313B;--line:#3A4350;--text:#ECE8DF;--dim:#9AA3AE;--accent:#2FD3C0;--accentInk:#0C2522;
  --g:#3DBE7A;--y:#E3C744;--o:#EF8A2D;--r:#E5575B;--tape:#11151A;--needle:#ECE8DF;color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:17px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.01em;margin:0;line-height:1.05}
h1{font-size:44px}h2{font-size:30px}h3{font-size:22px}
.num{font-family:"Saira Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 120px}
.muted{color:var(--dim)}
.small{font-size:14px}
p{margin:6px 0}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--panel);padding:12px 18px;font-weight:700;font-size:18px;width:100%;text-align:left}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .sub{display:block;font-weight:400;font-size:14px;opacity:.85}
.btn.row{justify-content:flex-start}
.stack{display:grid;gap:10px}
.link{text-align:left;background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0;min-height:44px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px}
.vbar{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left;min-height:48px}
.vbar b{display:block;font-family:"Saira Condensed",sans-serif;font-size:20px;line-height:1.1}
.vbar span{font-size:13px;color:var(--dim)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--g);box-shadow:0 0 0 4px color-mix(in srgb,var(--g) 25%,transparent)}
.iconbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;min-height:64px;display:grid;place-items:center;gap:2px;font-size:13px;color:var(--dim);padding:6px 0}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
/* welcome */
.hero{padding:34px 0 18px}
.hero h1{font-size:64px;line-height:.92}
.hero p{font-size:19px;max-width:30ch}
.gaugeHero{margin:22px 0 26px}
/* finder */
.crumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.crumb{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:700;font-size:15px}
.crumb.now{border-style:dashed;color:var(--dim);font-weight:400}
.steptitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.steptitle .muted{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid.one{grid-template-columns:1fr}
.tile{position:relative;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile b{font-family:"Saira Condensed",sans-serif;font-size:23px;line-height:1.05}
.tile small{color:var(--dim);font-size:14px}
.tile .cnt{font-size:13px;color:var(--accent);font-weight:700}
.tile[aria-disabled="true"]{opacity:.5;border-style:dashed;cursor:not-allowed}
.tile[aria-disabled="true"] .cnt{color:var(--dim)}
.tile .lock{position:absolute;top:10px;right:10px;font-size:12px;color:var(--dim)}
.search{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);padding:0 16px;font:inherit;margin-bottom:12px}
.note{border-left:4px solid var(--accent);background:var(--panel);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0;font-size:15px}
.field{display:grid;gap:6px;margin:10px 0}
.field label{font-weight:700}
.plate{font-family:"Saira Condensed",sans-serif;font-size:34px;letter-spacing:.12em;text-align:center;text-transform:uppercase;min-height:72px;border:3px solid var(--text);border-radius:10px;background:var(--panel);color:var(--text);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:10px;min-height:48px;min-width:56px;padding:0 14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
/* vehicle card */
.vcard{border:2px solid var(--line);border-radius:18px;background:var(--panel);padding:18px;display:grid;gap:10px}
.vcard .sil{height:96px;color:var(--dim)}
.vcard h2{font-size:34px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.spec dt{color:var(--dim)}.spec dd{margin:0;font-weight:700}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
/* cartridges */
.carts{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin:0 -18px;padding-left:18px;scroll-snap-type:x mandatory}
.cart{scroll-snap-align:start;flex:none;width:118px;min-height:132px;border:2px solid var(--line);border-radius:12px 12px 4px 4px;background:var(--panel);padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.cart::after{content:"";position:absolute;left:14px;right:14px;bottom:-2px;height:6px;border-radius:2px 2px 0 0;background:var(--line)}
.cart b{font-family:"Saira Condensed",sans-serif;font-size:21px;line-height:1}
.cart[aria-pressed="true"]{border-color:var(--accent)}
.cart[aria-pressed="true"]::after{background:var(--accent)}
.cart .oncar{font-size:12px;color:var(--g);font-weight:700}.cart .mine{font-size:12px;color:var(--accent);font-weight:700}.cart .tlv{font-size:11px;color:var(--dim);font-weight:700}
.folder{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}.folder .chip{min-height:44px}
.filed{border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.meter{display:grid;gap:4px;font-size:11px;color:var(--dim)}
.meter i{display:block;height:5px;border-radius:3px;background:var(--raise);overflow:hidden}
.meter i span{display:block;height:100%;background:var(--text)}
/* sections */
.levels{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--line);border-radius:14px;overflow:hidden;margin:6px 0 14px}
.levels button{border:0;background:var(--panel);min-height:56px;font-weight:700;font-size:15px;padding:4px}
.levels button+button{border-left:2px solid var(--line)}
.levels button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.levels button span{display:block;font-weight:400;font-size:12px;opacity:.75}
.secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 69px);z-index:4;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:8px 18px;margin:0 -18px 8px;border-bottom:1px solid var(--line)}
.secbtn{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:999px;min-height:44px;padding:0 14px;font-weight:700;display:flex;align-items:center;gap:8px}
.secbtn[aria-pressed="true"]{border-color:var(--text)}
.zmark{display:inline-block;width:12px;height:12px;flex:none}
.zmark.green{background:var(--g);border-radius:50%}
.zmark.yellow{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--y)}
.zmark.orange{background:var(--o);transform:rotate(45deg) scale(.85)}
.zmark.red{background:var(--r)}
/* setting row */
.set{border-top:1px solid var(--line);padding:18px 0}
.sethead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sethead h3{font-size:22px}
.sethead .val{font-size:34px;line-height:1}
.stock{font-size:13px;color:var(--dim)}
.zword{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:10px 0 4px}
.zword.green{color:var(--g)}.zword.yellow{color:var(--y)}.zword.orange{color:var(--o)}.zword.red{color:var(--r)}
/* tape gauge — the signature control */
.tapewrap{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin-top:10px}
.step{height:72px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:28px;font-weight:700}
.tape{position:relative;height:72px;border-radius:12px;background:var(--tape);overflow:hidden;touch-action:none;cursor:grab;border:2px solid var(--line)}
.tape:active{cursor:grabbing}
.tape svg{position:absolute;top:0;left:0;height:100%;will-change:transform}
.needle{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--needle);pointer-events:none}
.needle::before{content:"";position:absolute;left:-7px;top:-1px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid var(--needle)}
.fade{position:absolute;top:0;bottom:0;width:40px;pointer-events:none}
.fade.l{left:0;background:linear-gradient(90deg,var(--tape),transparent)}.fade.r{right:0;background:linear-gradient(270deg,var(--tape),transparent)}
.fixes{display:grid;gap:8px;margin-top:10px}
.fixes h4{margin:6px 0 0;font-size:15px}
.fix{text-align:left;border:2px solid var(--accent);background:transparent;border-radius:12px;padding:10px 14px;min-height:52px;font-weight:700;color:var(--text)}
.fix small{display:block;font-weight:400;color:var(--dim);font-size:13px}
.more{background:none;border:0;color:var(--accent);font-weight:700;min-height:44px;padding:0}
.risk{border-left:4px solid var(--r);padding:8px 12px;margin-top:8px;background:color-mix(in srgb,var(--r) 10%,var(--panel));border-radius:0 10px 10px 0;font-size:15px}
/* switches */
.sw{display:flex;align-items:center;gap:14px}
.sw h3{flex:1;font-size:21px}
.toggle{position:relative;width:76px;height:44px;border-radius:22px;border:2px solid var(--line);background:var(--raise);flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:var(--dim);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.toggle[aria-checked="true"]::after{left:36px;background:var(--accentInk)}
.guard{position:relative}
.guard .cover{position:absolute;inset:-4px;border-radius:24px;border:2px solid var(--r);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--r) 30%,var(--panel)) 0 8px,var(--panel) 8px 16px);font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--text)}
.locked{display:flex;align-items:center;gap:12px;border:2px dashed var(--line);border-radius:12px;padding:12px;margin-top:10px}
.locked b{flex:1}
@media (prefers-reduced-motion:reduce){.toggle::after{transition:none}*{scroll-behavior:auto!important}}
/* live */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gauge{border:2px solid var(--line);border-radius:14px;background:var(--panel);padding:12px}
.gauge .num{font-size:44px;line-height:1}
.gauge small{color:var(--dim)}
.bar{height:8px;border-radius:4px;background:var(--raise);margin-top:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--text)}
.dyno{border:2px solid var(--line);border-radius:14px;background:var(--panel);padding:12px;margin-top:14px}
.dyno svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:4px;vertical-align:middle;margin-right:6px;border-radius:2px}
/* flash */
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.check .ic{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700}
.check.ok .ic{background:var(--g);border-color:var(--g);color:#fff}
.check.bad .ic{background:var(--r);border-color:var(--r);color:#fff}
.check.run .ic{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.check b{display:block}
.diff{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:15px;align-items:center}
.diff .num{font-size:18px}
.volt{font-size:56px;line-height:1}
/* shop */
.tier{text-align:left;width:100%;border:2px solid var(--line);border-radius:16px;background:var(--panel);padding:16px;display:grid;gap:8px}
.tier[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.tier .price{font-size:42px;line-height:1}
.tier ul{margin:0;padding-left:20px;font-size:15px}
.tier .owned{color:var(--g);font-weight:700}
.pack{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:14px 0}
.pack div{flex:1}
.pack .num{font-size:24px}
.promise{display:grid;gap:6px;border:2px solid var(--text);border-radius:14px;padding:14px;margin:16px 0}
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--text);color:var(--bg)}
.cartbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.cartbar .num{font-size:30px}
.cartbar button{margin-left:auto;background:var(--accent);color:var(--accentInk);border:0;border-radius:12px;min-height:52px;padding:0 20px;font-weight:700}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .2s;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet .in{max-width:560px;margin:0 auto;padding:20px 18px 26px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:30;display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
</style>
</head>

<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------------- pricing: one place to edit ---------------- */

function packFor(id,seg){for(var i=0;i<PACKS.length;i++){var p=PACKS[i];if(p.ids&&p.ids.indexOf(id)>=0)return p;if(p.seg&&p.seg===seg)return p}return null}
function money(n){return "A$"+n.toLocaleString("en-AU")}

/* ---------------- vehicle catalogue (Australian market) ---------------- */
var CATS=[
  {id:"car",name:"Car, ute and 4WD",sub:"Passenger, 4WD, vans and light commercial"},
  {id:"truck",name:"Truck and prime mover",sub:"Rigid, prime mover, light truck",biz:true},
  {id:"ag",name:"Tractor and ag",sub:"Tractors, sprayers, harvest",biz:true},

];

var NA="na_petrol",TP="turbo_petrol",TD="turbo_diesel";
var AUTO6="6-speed auto",MAN6="6-speed manual";
var CATALOG=[
 {cat:"car",make:"Ford",model:"Falcon",gens:[
  {g:"FG X",y:"2014–2016",e:[en("4.0 Barra 270T turbo","Barra 270T",270,533,TP,"ford-spanish-oak",[AUTO6,MAN6]),en("4.0 Barra","Barra 195",195,391,NA,"ford-spanish-oak",[AUTO6,MAN6]),en("5.0 supercharged V8","Miami V8",335,570,TP,"ford-spanish-oak",[AUTO6,MAN6])]},
  {g:"FG",y:"2008–2014",e:[en("4.0 Barra 270T turbo","Barra 270T",270,533,TP,"ford-spanish-oak",[AUTO6,MAN6]),en("4.0 Barra","Barra 195",195,391,NA,"ford-spanish-oak",[AUTO6,MAN6])]}]},

  var t=$("ht"),target=1.5,cur=0,reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(){if(!document.body.contains(t))return;var b=def.bands(ctx,v);drawTape(t,def,cur,b,ctx,"standard");$("hv").textContent=(cur>0?"+":"")+cur.toFixed(1)+"°"}

/* ---------------- step-by-step finder ---------------- */
var STEPS=[["cat","Type"],["make","Make"],["model","Model"],["gen","Generation"],["eng","Engine"],["trans","Transmission"]];
function listFor(step,sel){
  var rows=ALL.filter(function(c){return(!sel.cat||c.cat===sel.cat)&&(!sel.make||step==="make"||c.make===sel.make)&&(!sel.model||["make","model"].indexOf(step)>=0||c.model===sel.model)});
  if(step==="cat")return CATS.filter(function(c){return !c.biz||catAllowed(c.id)}).map(function(c){var n=ALL.filter(function(x){return x.cat===c.id}).length;return{key:c.id,title:c.name,sub:c.sub,cnt:n+" models"}});
  if(step==="make"){var m={},pop=POPULAR[sel.cat]||[];rows.forEach(function(r){m[r.make]=(m[r.make]||0)+1});return Object.keys(m).sort(function(a,b){var ia=pop.indexOf(a),ib=pop.indexOf(b);if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib||a.localeCompare(b)}).map(function(k){return{key:k,title:k,cnt:m[k]+(m[k]>1?" models":" model")}})}
  if(step==="model")return rows.slice().sort(function(a,b){return (a.generic?1:0)-(b.generic?1:0)||a.model.localeCompare(b.model)}).map(function(r){var e=[].concat.apply([],r.gens.map(function(g){return g.e}));var ok=e.filter(function(x){return x.ecu}).length;
    if(r.generic)return{key:r.model,title:r.model,sub:ok?"":"Electric",cnt:ok?"Supported":"Live data only",off:!ok};
    return{key:r.model,title:r.model,sub:r.gens.map(function(g){return g.g}).join(", "),cnt:ok+" engine"+(ok>1?"s":"")+" in detail"}});
  var row=rows[0];if(!row)return[];
  if(step==="gen")return row.gens.map(function(g){if(g.other)return{key:g.g,title:g.g,sub:g.y,cnt:"Engine read when you plug in"};var ok=g.e.filter(function(x){return x.ecu}).length;return{key:g.g,title:g.g,sub:g.y,cnt:ok?ok+" engine"+(ok>1?"s":""):"Not supported yet",off:!ok}});
  var gen=row.gens.find(function(g){return g.g===sel.gen});if(!gen)return[];
  if(step==="eng")return gen.e.map(function(e){return{key:e.n,title:e.n,sub:(row.generic||gen.other)?"Exact engine and ECU read by the receiver":e.code+(e.kw?", "+e.kw+" kW / "+e.nm+" Nm":""),cnt:e.ecu?(prof(e.ecu).status==="ready"?"Full tune ready":"Supported"):e.note,off:!e.ecu}});
  var eng=gen.e.find(function(e){return e.n===sel.eng});if(!eng)return[];
  if(step==="trans")return eng.trans.map(function(t){return{key:t,title:t}});
  return[];
}
function nextStep(step){var i=STEPS.findIndex(function(s){return s[0]===step});return i<STEPS.length-1?STEPS[i+1][0]:null}
function clearAfter(sel,step){var i=STEPS.findIndex(function(s){return s[0]===step});STEPS.slice(i+1).forEach(function(s){delete sel[s[0]]})}
function advance(){ // auto-skip steps with a single valid answer
  var f=S.finder,skipped=[];
  while(f.step){var list=listFor(f.step,f.sel),valid=list.filter(function(x){return !x.off});
    if(f.step!=="cat"&&valid.length===1&&list.length===1){f.sel[f.step]=valid[0].key;skipped.push(valid[0].title);f.step=nextStep(f.step);continue}
    if(f.step==="trans"&&list.length===0){f.step=null;continue}
    break}
  f.skipped=skipped;if(!f.step){go("confirm");return true}return false;
}

    l.filter(function(x){return !ql||(x.title+" "+(x.sub||"")).toLowerCase().indexOf(ql)>=0}).forEach(function(x){
      var b=document.createElement("button");b.className="tile";if(x.off){b.setAttribute("aria-disabled","true")}

      b.onclick=function(){if(x.off){toast(x.cnt||"Not supported yet");return}f.sel[f.step]=x.key;f.q="";f.step=nextStep(f.step);if(!f.step){go("confirm");return}render();window.scrollTo(0,0)};host.appendChild(b)})}

    var id=String(Date.now());var u={id:id,vid:v.id,name:"My "+base+" "+n,from:t.id,values:vals};fileInto(v,u);S.user[id]=u;S.preset="u:"+id;save();

  if(!c.makes.length&&v)c.makes=[v.make];
  var visible=TIERS.filter(function(t){return !t.biz||S.showBiz||own.licences.some(function(l){return l.tier===t.id})});
  function lineItems(){ // price each chosen make at the chosen level; upgrades pay the difference
    if(!c.tier)return[];var t=tierOf(c.tier),items=[],firstNew=!own.licences.some(function(l){return l.tier===c.tier});
    c.makes.forEach(function(mk){var ex=licenceFor(mk);if(ex&&ex.tier===c.tier)return;
      var full=firstNew?t.price:Math.round(t.price*EXTRA_MAKE);firstNew=false;
      var credit=ex?(tierOf(ex.tier).price>=t.price?full:Math.min(full,tierOf(ex.tier).price)):0;
      items.push({label:t.name+" licence, "+mk+(ex?" (upgrade from "+tierOf(ex.tier).name+")":""),price:Math.max(0,full-credit),make:mk})});
    return items}
  function total(){var n=lineItems().reduce(function(a,b){return a+b.price},0);Object.keys(c.packs).forEach(function(k){n+=PACKS.find(function(x){return x.id===k}).price});return n}
  m.innerHTML='<h2>Licences</h2><p class="muted">One payment per make. Every vehicle of that make you own, now and later, is covered.</p>'+
   '<div class="promise"><b>Our promise</b><span>No subscriptions, no renewals, no surprise charges.</span><span>Every price is shown here before you pay.</span><span>Return to stock is free, forever.</span><span>Explore, tune and preview free. You only pay to write to the vehicle.</span></div>'+
   '<h3 style="margin:18px 0 10px">1. Choose a level</h3><div class="stack" id="tiers"></div>'+
   (S.showBiz?'':'<button class="link" id="biz">Trucks, ag or earthmoving? See business licences</button>')+
   (c.tier?'<h3 style="margin:22px 0 4px">2. Choose your make</h3><p class="muted small" style="margin:0 0 10px">First make '+money(tierOf(c.tier).price)+'. Each extra make '+money(Math.round(tierOf(c.tier).price*EXTRA_MAKE))+'.</p><div class="chips" id="makes"></div>':'')+
   '<h3 style="margin:22px 0 4px">'+(c.tier?"3. ":"")+'Optional packs</h3><p class="muted small" style="margin:0">One-off. Work across every make you licence.</p><div id="packs"></div>'+
   (own.licences.length?'<h3 style="margin:22px 0 8px">What you own</h3>'+own.licences.map(function(l){return '<p><b>'+esc(l.make)+'</b>, '+esc(tierOf(l.tier).name)+'</p>'}).join("")+(own.packs.length?'<p class="muted">Packs: '+esc(own.packs.map(function(k){return PACKS.find(function(p){return p.id===k}).name}).join(", "))+'</p>':'')+'<button class="btn ghost" id="xfer">Change a licence to another make</button><button class="link" id="resetDemo">Reset demo purchases</button>':'')+
   '<p class="muted small" style="margin-top:18px">Prices in AUD including GST. Demo checkout, no payment is taken.</p>';
  var th=$("tiers");visible.forEach(function(t){var sel=c.tier===t.id;var b=document.createElement("button");b.className="tier";b.setAttribute("aria-pressed",sel?"true":"false");
    b.innerHTML='<div class="sethead"><h3>'+esc(t.name)+'</h3><span class="num price">'+money(t.price)+'</span></div><span class="muted">'+esc(t.blurb)+', per make</span><ul>'+t.inc.map(function(i){return '<li>'+esc(i)+'</li>'}).join("")+'</ul>';
    b.onclick=function(){c.tier=sel?null:t.id;if(c.tier){var ok=makesFor(c.tier);c.makes=c.makes.filter(function(x){return ok.indexOf(x)>=0});if(!c.makes.length&&v&&ok.indexOf(v.make)>=0)c.makes=[v.make]}render()};th.appendChild(b)});
  if($("biz"))$("biz").onclick=function(){S.showBiz=true;render()};
  if($("makes")){var mh=$("makes");makesFor(c.tier).forEach(function(mk){var ex=licenceFor(mk),same=ex&&ex.tier===c.tier;var b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",c.makes.indexOf(mk)>=0&&!same?"true":"false");
    b.textContent=mk+(same?" (owned)":ex?" (upgrade)":"");if(same)b.disabled=true;
    b.onclick=function(){var i=c.makes.indexOf(mk);if(i>=0)c.makes.splice(i,1);else c.makes.push(mk);render()};mh.appendChild(b)})}
  var ph=$("packs");PACKS.forEach(function(p){var have=own.packs.indexOf(p.id)>=0,n=c.packs[p.id]||0;var d=document.createElement("div");d.className="pack";
    d.innerHTML='<div><b>'+esc(p.name)+'</b><br><span class="muted small">'+esc(p.what)+'</span></div><span class="num">'+money(p.price)+'</span>'+(have?'<span style="color:var(--g);font-weight:700">Owned</span>':'<button class="chip" aria-pressed="'+(n>0)+'">'+(n?"Added":"Add")+'</button>');
    var b=d.querySelector("button");if(b)b.onclick=function(){if(n)delete c.packs[p.id];else c.packs[p.id]=1;render()};ph.appendChild(d)});
  var tot=total(),items=lineItems();
  if(tot>0){var bar=document.createElement("div");bar.className="cartbar";bar.innerHTML='<div class="in"><span>Total<br><span class="num">'+money(tot)+'</span></span><button id="pay">Review and pay</button></div>';m.appendChild(bar);
    $("pay").onclick=function(){openSheet('<h2>Checkout</h2><div class="diff" style="margin:12px 0;grid-template-columns:1fr auto">'+
      items.map(function(i){return '<span>'+esc(i.label)+'</span><span class="num">'+money(i.price)+'</span>'}).join("")+
      Object.keys(c.packs).map(function(k){var p=PACKS.find(function(x){return x.id===k});return '<span>'+esc(p.name)+' pack</span><span class="num">'+money(p.price)+'</span>'}).join("")+
      '<b>Total, paid once</b><b class="num">'+money(tot)+'</b></div><p class="muted small">Nothing else will be charged. No renewals.</p><button class="btn primary" id="confirmPay" style="margin-top:10px">Pay '+money(tot)+'</button>');
      $("confirmPay").onclick=function(){items.forEach(function(i){var ex=licenceFor(i.make);if(ex)ex.tier=c.tier;else own.licences.push({tier:c.tier,make:i.make})});Object.keys(c.packs).forEach(function(k){if(own.packs.indexOf(k)<0)own.packs.push(k)});S.cart={tier:null,makes:[],packs:{}};save();closeSheet();toast("Paid. Thanks!");render()}}}
  if($("xfer"))$("xfer").onclick=function(){openSheet('<h2>Change make</h2><p>Sold your last '+esc(own.licences[0].make)+'? Move that licence to another make, free. Return the old vehicle to stock first.</p><button class="btn primary" id="okx" style="margin-top:10px">Got it</button>');$("okx").onclick=closeSheet};
  if($("resetDemo"))$("resetDemo").onclick=function(){S.owned={licences:[],packs:[]};S.agreed=false;save();render()};
}

render();
</script>
</body>
</html>
